<!-- Paste into apps/web/index.html <head>. Order matters little, but keep all. -->

<!-- Safe-area aware viewport (lets content sit under the notch / home indicator) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<!-- Manifest + theme -->
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#06090B" />
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />

<!-- iOS: installable to home screen, full-screen standalone -->
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Power" />
