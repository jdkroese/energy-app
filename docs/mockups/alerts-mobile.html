<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Power — Alerts (mobile / PWA)</title>
<link rel="stylesheet" href="_ds/styles.css" />
<style>
  html, body { height: 100%; }
  body { margin: 0; background: radial-gradient(circle at 50% 0%, #0c1418, var(--bg-0)); color: var(--text-1);
    min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
  .phone { width: 390px; height: 844px; border-radius: 46px; background: var(--bg-0); border: 10px solid #1a2227;
    box-shadow: 0 40px 90px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.04); overflow: hidden;
    display: flex; flex-direction: column; position: relative; }
  .scroll { flex: 1; overflow-y: auto; }
  .scroll::-webkit-scrollbar { width: 0; }
  .row { display:flex; align-items:center; gap:12px; padding:13px 16px; }
  .chip { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; flex:none; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="_ds/_ds_bundle.js"></script>
<script type="text/babel">
const DS = window.PowerDesignSystem_138199 || {};
const { Card, Badge, Switch, StatusDot } = DS;
const Ico = ({n, s}) => <i data-lucide={n} style={s}></i>;
function Eyebrow({children}){ return <span style={{fontSize:9,fontWeight:600,letterSpacing:'.12em',textTransform:'uppercase',color:'var(--text-2)'}}>{children}</span>; }

const COL = { danger:'var(--danger)', warning:'var(--grid)', info:'var(--battery)', ok:'var(--solar)' };
const WASH = { danger:'var(--danger-wash)', warning:'var(--grid-wash)', info:'var(--battery-wash)', ok:'var(--solar-wash)' };
const ALERTS = [
  { sev:'danger',  icon:'power',          title:'Tesla Powerwall powered off', sub:'Powerwall · voltage fluctuation', time:'12 min ago', status:'New' },
  { sev:'warning', icon:'battery-warning',title:'Backup reserve low',          sub:'Tesla · 14% (target 20%)',         time:'1h ago',    status:'New' },
  { sev:'warning', icon:'plug-zap',       title:'Sonnen charging from grid',   sub:'Sonnen · drawing 3.2 kW at 100%',  time:'2h ago',    status:'Ack' },
  { sev:'info',    icon:'cloud-sun',      title:'Overnight charge planned',    sub:'Optimizer · dull day tomorrow',    time:'3h ago',    status:'New' },
  { sev:'ok',      icon:'circle-check',   title:'Tesla reconnected',           sub:'Powerwall · back online',          time:'Yesterday', status:'Resolved' },
  { sev:'warning', icon:'wifi-off',       title:'Sungrow inverter offline',    sub:'Array A · no response 20 min',     time:'Yesterday', status:'Resolved' },
];
const RULES = [
  ['power', 'Tesla power-off / dropout', true],
  ['battery-warning', 'Backup reserve below 15%', true],
  ['alert-triangle', 'Sonnen fault or alarm', true],
  ['plug-zap', 'Abnormal grid-charging', true],
  ['cloud-sun', 'Optimizer notices', false],
];

function StatusPill({s}){
  const map = { New:{c:'var(--danger)',b:'var(--danger-wash)'}, Ack:{c:'var(--battery)',b:'var(--battery-wash)'}, Resolved:{c:'var(--text-3)',b:'transparent'} };
  const m = map[s];
  return <span style={{fontSize:10,fontWeight:600,color:m.c,background:m.b,padding:'3px 8px',borderRadius:999,border:s==='Resolved'?'1px solid var(--border-2)':'none'}}>{s}</span>;
}

function AlertsMobile(){
  React.useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });
  const active = ALERTS.filter(a=>a.status!=='Resolved').length;
  return (
    <React.Fragment>
      <div style={{display:'flex',alignItems:'center',gap:12,padding:'12px 18px 12px'}}>
        <div style={{flex:1}}>
          <Eyebrow>Alerts</Eyebrow>
          <h1 style={{fontSize:24,fontWeight:700,letterSpacing:'-.02em',margin:'2px 0 0'}}>Notifications</h1>
        </div>
        <span style={{fontSize:11,fontWeight:600,color:'var(--danger)',background:'var(--danger-wash)',padding:'5px 11px',borderRadius:999}}>{active} active</span>
      </div>

      <div style={{display:'flex',flexDirection:'column',gap:12,padding:'0 14px 22px'}}>
        {/* feed */}
        <Card style={{padding:0,overflow:'hidden'}}>
          {ALERTS.map((a,i)=>(
            <div key={i} className="row" style={{borderTop:i?'1px solid var(--border-1)':'none',opacity:a.status==='Resolved'?.6:1}}>
              <span className="chip" style={{background:WASH[a.sev],color:COL[a.sev]}}><Ico n={a.icon} s={{width:17,height:17}}/></span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,fontWeight:500,lineHeight:1.25}}>{a.title}</div>
                <div style={{fontSize:12,color:'var(--text-2)',marginTop:2}}>{a.sub}</div>
              </div>
              <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:5}}>
                <StatusPill s={a.status} />
                <span style={{fontSize:10.5,color:'var(--text-3)',fontFamily:'var(--font-mono)'}}>{a.time}</span>
              </div>
            </div>
          ))}
        </Card>

        {/* channels */}
        <Card title="Notify via" style={{padding:0}}>
          {[['message-circle','WhatsApp','+34 ··· ··· 89','solar',true],['bell','Push notifications','This iPhone · installed','solar',true],['mail','Email','j.kroese@levante.nl','text-3',false]].map((c,i)=>(
            <div key={i} className="row" style={{borderTop:'1px solid var(--border-1)'}}>
              <span className="chip" style={{background:'var(--surface-3)',color:`var(--${c[3]})`}}><Ico n={c[0]} s={{width:17,height:17}}/></span>
              <div style={{flex:1}}>
                <div style={{fontSize:14}}>{c[1]}</div>
                <div style={{fontSize:12,color:'var(--text-2)',fontFamily:'var(--font-mono)'}}>{c[2]}</div>
              </div>
              {Switch ? <Switch defaultChecked={c[4]} /> : null}
            </div>
          ))}
        </Card>

        {/* rules */}
        <Card title="Alert rules" style={{padding:0}}>
          {RULES.map((r,i)=>(
            <div key={i} className="row" style={{borderTop:'1px solid var(--border-1)'}}>
              <span style={{color:'var(--text-2)'}}><Ico n={r[0]} s={{width:17,height:17}}/></span>
              <span style={{flex:1,fontSize:14}}>{r[1]}</span>
              {Switch ? <Switch defaultChecked={r[2]} /> : null}
            </div>
          ))}
        </Card>
      </div>
    </React.Fragment>
  );
}

function StatusBar(){
  return (<div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 24px 4px',fontFamily:'var(--font-mono)',fontSize:14,color:'var(--text-1)',fontWeight:600}}>
    <span>9:41</span><div style={{display:'flex',gap:6}}><Ico n="signal" s={{width:16,height:16}}/><Ico n="wifi" s={{width:16,height:16}}/><Ico n="battery-full" s={{width:18,height:18}}/></div></div>);
}
function PhoneApp(){
  const [tab,setTab] = React.useState('alerts');
  React.useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });
  const tabs = [['live','Live','activity'],['reports','Reports','bar-chart-3'],['batteries','Batteries','battery-charging'],['alerts','Alerts','bell'],['more','More','menu']];
  return (
    <div className="phone">
      <StatusBar />
      <div className="scroll">{tab==='alerts' ? <AlertsMobile /> : <div style={{padding:40,textAlign:'center',color:'var(--text-3)'}}>{tab} — see other mockups</div>}</div>
      <div style={{display:'flex',padding:'9px 10px 22px',borderTop:'1px solid var(--border-1)',background:'var(--glass-fill, rgba(15,22,25,.8))',backdropFilter:'blur(var(--blur-glass, 18px))'}}>
        {tabs.map(t=>{ const on=tab===t[0];
          return (<button key={t[0]} onClick={()=>setTab(t[0])} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4,border:'none',background:'transparent',cursor:'pointer',color:on?'var(--solar)':'var(--text-3)'}}>
            <Ico n={t[2]} s={{width:21,height:21}}/><span style={{fontSize:10,fontWeight:on?600:500}}>{t[1]}</span></button>); })}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<PhoneApp />);
setTimeout(()=>{ if(window.lucide) window.lucide.createIcons(); }, 60);
setTimeout(()=>{ if(window.lucide) window.lucide.createIcons(); }, 400);
</script>
</body>
</html>
