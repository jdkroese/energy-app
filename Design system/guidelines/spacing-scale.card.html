<!-- @dsCard group="Spacing" viewport="700x190" name="Spacing scale" subtitle="4px base grid" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-0); }
  .rows { display: flex; flex-direction: column; gap: 9px; }
  .r { display: flex; align-items: center; gap: 14px; }
  .bar { height: 14px; background: var(--solar); border-radius: 3px; box-shadow: var(--glow-soft); }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--text-2); width: 96px; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); }
</style>
</head>
<body>
  <div class="rows">
    <div class="r"><span class="tok">--space-1</span><div class="bar" style="width:4px"></div><span class="px">4px</span></div>
    <div class="r"><span class="tok">--space-2</span><div class="bar" style="width:8px"></div><span class="px">8px</span></div>
    <div class="r"><span class="tok">--space-3</span><div class="bar" style="width:12px"></div><span class="px">12px</span></div>
    <div class="r"><span class="tok">--space-4</span><div class="bar" style="width:16px"></div><span class="px">16px</span></div>
    <div class="r"><span class="tok">--space-6</span><div class="bar" style="width:24px"></div><span class="px">24px</span></div>
    <div class="r"><span class="tok">--space-8</span><div class="bar" style="width:32px"></div><span class="px">32px</span></div>
    <div class="r"><span class="tok">--space-12</span><div class="bar" style="width:48px"></div><span class="px">48px</span></div>
    <div class="r"><span class="tok">--space-16</span><div class="bar" style="width:64px"></div><span class="px">64px</span></div>
  </div>
</body>
</html>
