<!-- @dsCard group="Brand" viewport="700x200" name="Logo & wordmark" subtitle="The Power mark — bolt in an energy-node chip" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px 28px; background: var(--bg-0); }
  .row { display: flex; align-items: center; gap: 40px; flex-wrap: wrap; }
  .lockup { display: flex; align-items: center; gap: 14px; }
  .wm { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-1); }
  .wm b { color: var(--solar); font-weight: 700; }
  img { display: block; }
  .light { background: #eef2f1; padding: 16px 20px; border-radius: var(--radius-lg); }
  .light .wm { color: #0c1614; }
  .light .wm b { color: var(--solar-dim); }
  .cap { font-size: var(--fs-xs); color: var(--text-3); margin-top: 16px; letter-spacing: .04em; }
</style>
</head>
<body>
  <div class="row">
    <div class="lockup"><img src="../assets/logo-mark.svg" width="56" height="56" alt="Power logomark" /></div>
    <div class="lockup">
      <img src="../assets/logo-mark.svg" width="44" height="44" alt="" />
      <span class="wm"><b>Power</b></span>
    </div>
    <div class="lockup light">
      <img src="../assets/logo-mark.svg" width="40" height="40" alt="" />
      <span class="wm"><b>Power</b></span>
    </div>
  </div>
  <div class="cap">Mark = a bolt held inside the same rounded chip used for energy nodes. Wordmark is Space Grotesk Bold; the "P" hue may sit in solar green on dark, solar-dim on light.</div>
</body>
</html>
