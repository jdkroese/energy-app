<!-- @dsCard group="Type" viewport="700x260" name="Display & headings" subtitle="Space Grotesk — geometric, tight tracking" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-0); }
  .specimen { display: flex; flex-direction: column; gap: 14px; }
  .line { display: flex; align-items: baseline; gap: 16px; }
  .t { color: var(--text-1); font-weight: 600; letter-spacing: var(--ls-display); white-space: nowrap; }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); }
</style>
</head>
<body>
  <div class="specimen">
    <div class="line"><span class="t" style="font-size:var(--fs-display)">Power at a glance</span><span class="tok">display · 40 / 700</span></div>
    <div class="line"><span class="t" style="font-size:var(--fs-h1)">Solar &amp; storage</span><span class="tok">h1 · 30 / 600</span></div>
    <div class="line"><span class="t" style="font-size:var(--fs-h2)">Today's production</span><span class="tok">h2 · 24 / 600</span></div>
    <div class="line"><span class="t" style="font-size:var(--fs-h3);font-weight:500">Battery details</span><span class="tok">h3 · 20 / 500</span></div>
    <div class="line"><span style="font-size:var(--fs-body);color:var(--text-2)">Body — your home produced more than it used today, exporting the surplus to the grid.</span><span class="tok">body · 15</span></div>
    <div class="line"><span class="pwr-eyebrow">Live overview</span><span class="tok">eyebrow · 11 / 600 · 0.08em</span></div>
  </div>
</body>
</html>
