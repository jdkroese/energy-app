# nginx vhost for energy.hirobo.nl
# Install at /etc/nginx/sites-available/energy (symlinked into sites-enabled).
# SSL is certbot-managed (cert already issued 2026-06-24).
# Serves the React build from /var/www/energy and proxies /api -> the API on :3002.

server {
    listen 80;
    server_name energy.hirobo.nl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name energy.hirobo.nl;

    ssl_certificate     /etc/letsencrypt/live/energy.hirobo.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/energy.hirobo.nl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/energy;
    index index.html;

    # Tesla Fleet API public key (must stay reachable for partner registration).
    location = /.well-known/appspecific/com.tesla.3p.public-key.pem {
        default_type application/x-pem-file;
        try_files $uri =404;
    }

    # SPA client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> Express on localhost.
    location /api/ {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
