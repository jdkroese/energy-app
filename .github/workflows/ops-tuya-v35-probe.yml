name: Ops - Tuya v3.5 Probe

# READ-ONLY diagnostic. Answers one question: what local protocol do the devices
# our Node client cannot reach actually speak?
#
# tuyapi (Node) covers 3.1-3.4 only, and a v3.5 device is invisible twice over —
# its discovery broadcast is AES-GCM under a different frame magic, and every
# connection attempt then times out — so it reads as "powered off" and then as
# "dead". tinytuya (Python) implements 3.1-3.5 and can tell us the truth.
#
# Calls status() only; never writes a datapoint, never actuates anything.
# scripts/ + .github/ only, so deploy.yml skips it entirely.
on:
  push:
    branches: [spike/tuya-lan-discover]
  workflow_dispatch:

jobs:
  v35-probe:
    runs-on: [self-hosted, mini]
    timeout-minutes: 15
    env:
      DATA_DIR: /Users/joris/sites/energy/.data
    steps:
      - uses: actions/checkout@v4

      - name: Install tinytuya into a throwaway venv
        run: |
          set -euo pipefail
          # A venv keeps this off the system python, which on recent macOS is
          # externally-managed and would reject a plain pip install.
          python3 -m venv "${RUNNER_TEMP}/tuya-py"
          "${RUNNER_TEMP}/tuya-py/bin/pip" install --quiet --disable-pip-version-check tinytuya
          echo "TUYA_PY=${RUNNER_TEMP}/tuya-py/bin/python" >> "$GITHUB_ENV"

      - name: Probe protocol versions (read-only)
        run: |
          set -euo pipefail
          "$TUYA_PY" scripts/tuya-v35-probe.py
