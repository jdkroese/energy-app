name: Ops - Device Registry Forensics

# Manually-triggered, READ-ONLY diagnostics. Runs ON the mini (self-hosted runner)
# to investigate the disappeared fan/light-switch/ventilator devices: dumps the
# live deviceOnboarding state, looks for older state.json copies (leftover *.tmp,
# Time Machine snapshots), and greps the api log for unsetup/persist-failure/tuya
# traces. Changes NOTHING on the host.
on:
  workflow_dispatch:

jobs:
  forensics:
    runs-on: [self-hosted, mini]
    timeout-minutes: 8
    steps:
      - name: Inspect device registry state + history
        run: |
          set -uo pipefail
          SITE=/Users/joris/sites/energy
          DATA=$SITE/.data
          STATE=$DATA/state.json
          LOG=$SITE/api.log

          dump_onboarding() {
            node -e '
              try {
                const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                const o = d.deviceOnboarding || {};
                const cfg = o.configured || {};
                console.log(JSON.stringify({
                  customDeviceTypes: o.customDeviceTypes ?? [],
                  ignored: o.ignored ?? [],
                  configuredCount: Object.keys(cfg).length,
                  configured: Object.fromEntries(Object.entries(cfg).map(([id, c]) =>
                    [id, { typeId: c.typeId, name: c.name, setupAt: c.setupAt }])),
                }, null, 2));
              } catch (e) { console.log("(unreadable: " + e.message + ")"); }
            ' "$1"
          }

          echo "===== .data directory listing ====="
          ls -lat "$DATA" | head -60 || true

          echo
          echo "===== LIVE state.json deviceOnboarding ====="
          dump_onboarding "$STATE"

          echo
          echo "===== other state.json* files (tmp leftovers / backups) ====="
          for f in "$DATA"/state.json.* "$DATA"/state*.bak "$SITE"/state.json*; do
            [ -f "$f" ] || continue
            echo "--- $f ($(stat -f '%Sm' "$f"))"
            dump_onboarding "$f"
          done
          find "$SITE" -maxdepth 3 -name "state.json*" -not -path "*/node_modules/*" 2>/dev/null | head -20 || true

          echo
          echo "===== Time Machine: local APFS snapshots ====="
          tmutil listlocalsnapshots / 2>&1 || echo "(tmutil failed)"
          echo "--- latest external TM backup (if any):"
          tmutil latestbackup 2>&1 || echo "(no external backup / not accessible)"

          echo
          echo "===== try reading state.json from local snapshots (best-effort, read-only) ====="
          MNT=$(mktemp -d /tmp/tmsnap.XXXX)
          for SNAP in $(tmutil listlocalsnapshots / 2>/dev/null | sed 's/^com.apple.TimeMachine.//' | tail -6); do
            FULL="com.apple.TimeMachine.$SNAP"
            if mount_apfs -o ro -s "$FULL" /System/Volumes/Data "$MNT" 2>/dev/null; then
              F="$MNT/Users/joris/sites/energy/.data/state.json"
              if [ -f "$F" ]; then
                echo "--- snapshot $SNAP:"
                dump_onboarding "$F"
              else
                echo "--- snapshot $SNAP: no state.json at expected path"
              fi
              umount "$MNT" 2>/dev/null || diskutil unmount "$MNT" 2>/dev/null || true
            else
              echo "--- snapshot $SNAP: mount failed (needs privileges) — skipped"
            fi
          done
          rmdir "$MNT" 2>/dev/null || true

          echo
          echo "===== api.log: store persist/load problems ====="
          ls -la "$LOG"* 2>/dev/null || true
          grep -n "\[store\]" "$LOG" 2>/dev/null | tail -30 || echo "(none)"

          echo
          echo "===== api.log: device setup / unsetup / custom-type traffic ====="
          grep -inE "unsetup|devices/[A-Za-z0-9]+/setup|custom-types" "$LOG" 2>/dev/null | tail -60 || echo "(none)"

          echo
          echo "===== api.log: tuya connector errors (last 40) ====="
          grep -inE "tuya" "$LOG" 2>/dev/null | grep -viE "GET /api" | tail -40 || echo "(none)"

          echo
          echo "===== events / history databases in .data ====="
          ls -la "$DATA"/*.db "$DATA"/*.sqlite* 2>/dev/null || echo "(none)"
          for DB in "$DATA"/*.db; do
            [ -f "$DB" ] || continue
            echo "--- tables in $DB:"
            sqlite3 "$DB" ".tables" 2>/dev/null || echo "(sqlite3 failed)"
            sqlite3 "$DB" "SELECT ts, category, severity, summary FROM events WHERE summary LIKE '%setup%' OR summary LIKE '%Fan%' OR summary LIKE '%switch%' OR summary LIKE '%entilator%' ORDER BY ts DESC LIMIT 60;" 2>/dev/null || true
          done
