name: Ops - Device Registry Forensics

# Manually-triggered, READ-ONLY diagnostics. Runs ON the mini (self-hosted runner)
# to investigate the disappeared fan/light-switch/ventilator devices. Pass 2:
# harvest every Tuya device id ever referenced in state.json + events.jsonl with
# name context, so ghosts (ids no longer in the cloud fleet) can be identified.
# Changes NOTHING on the host.
on:
  workflow_dispatch:

jobs:
  forensics:
    runs-on: [self-hosted, mini]
    timeout-minutes: 8
    steps:
      - name: Harvest device ids + names from state and event history
        run: |
          set -uo pipefail
          DATA=/Users/joris/sites/energy/.data

          node -e '
            const fs = require("fs");
            const state = JSON.parse(fs.readFileSync(process.env.DATA + "/state.json", "utf8"));

            console.log("===== deviceSettings (id -> settings) =====");
            const ds = state.deviceSettings || {};
            for (const [id, v] of Object.entries(ds)) console.log(id, JSON.stringify(v));

            console.log("\n===== rooms =====");
            for (const [id, r] of Object.entries(state.rooms || {})) console.log(id, r.name);

            console.log("\n===== schedule scopes =====");
            for (const s of state.schedules || []) console.log(s.name, "|", s.type, "|", JSON.stringify(s.scope));

            console.log("\n===== light scene member ids =====");
            console.log(JSON.stringify(state.lightScenes ?? state.scenes ?? null)?.slice(0, 2000));

            // Every bf… token anywhere in state, with a rough JSON-path hint.
            console.log("\n===== all bf-ids in state.json (id -> count) =====");
            const txt = JSON.stringify(state);
            const counts = {};
            for (const m of txt.matchAll(/bf[0-9a-z]{15,25}/g)) counts[m[0]] = (counts[m[0]] || 0) + 1;
            for (const [id, n] of Object.entries(counts).sort((a, b) => b[1] - a[1])) console.log(id, n);
          ' 2>&1 | head -220
          export DATA

          echo
          echo "===== events.jsonl: id -> sample names ====="
          node -e '
            const fs = require("fs");
            const lines = fs.readFileSync(process.env.DATA + "/events.jsonl", "utf8").split("\n").filter(Boolean);
            console.log("total event lines:", lines.length);
            const byId = new Map();
            for (const ln of lines) {
              for (const m of ln.matchAll(/bf[0-9a-z]{15,25}/g)) {
                if (!byId.has(m[0])) byId.set(m[0], []);
                const arr = byId.get(m[0]);
                if (arr.length < 2) {
                  try {
                    const e = JSON.parse(ln);
                    arr.push(`${e.ts ?? ""} [${e.category ?? ""}] ${e.title ?? e.summary ?? ""} dev=${e.device ?? ""}`);
                  } catch { arr.push(ln.slice(0, 160)); }
                }
              }
            }
            for (const [id, samples] of byId) { console.log("--", id); for (const s of samples) console.log("   ", s); }

            console.log("\n===== events mentioning fan/ventilator/switch by NAME =====");
            let n = 0;
            for (const ln of lines) {
              if (/fan|entilator|light switch|fskg/i.test(ln)) {
                try { const e = JSON.parse(ln); console.log(`${e.ts} [${e.category}/${e.class}] ${e.title ?? e.summary ?? ""} dev=${e.device ?? ""}`); }
                catch { console.log(ln.slice(0, 200)); }
                if (++n > 80) break;
              }
            }

            console.log("\n===== devices-category events (last 60) =====");
            const dev = lines.filter((l) => /"category":"devices"/.test(l)).slice(-60);
            for (const ln of dev) {
              try { const e = JSON.parse(ln); console.log(`${e.ts} [${e.class}] ${e.title ?? e.summary ?? ""} dev=${e.device ?? ""}`); }
              catch { console.log(ln.slice(0, 200)); }
            }
          ' 2>&1 | head -400
        env:
          DATA: /Users/joris/sites/energy/.data
