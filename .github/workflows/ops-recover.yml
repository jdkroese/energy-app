name: Ops - Account Recovery

# Manually-triggered recovery. Runs ON the mini (self-hosted runner) and mints a
# fresh password-reset link by reading it from the energy-api log — this works
# even when email/WhatsApp delivery isn't configured. The link appears in this
# run's logs (single-use, ~1h expiry).
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Account email to mint a reset link for"
        required: true
        default: "j.kroese@levante.nl"

jobs:
  recover:
    runs-on: [self-hosted, mini]
    timeout-minutes: 6
    steps:
      - name: Mint reset link + diagnose
        env:
          ACCT_EMAIL: ${{ github.event.inputs.email }}
        run: |
          set -uo pipefail
          STATE=/Users/joris/sites/energy/.data/state.json
          LOG=/Users/joris/sites/energy/api.log

          echo "=== user record ==="
          node -e '
            const fs = require("fs");
            const e = (process.env.ACCT_EMAIL || "").toLowerCase();
            const d = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const users = (d.auth && d.auth.users) || [];
            const u = users.find(x => ((x.email || "").toLowerCase()) === e);
            const locked = ((d.auth && d.auth.loginAttempts) || {})[e] || "none";
            console.log(u
              ? JSON.stringify({ email: u.email, hasPassword: !!u.passwordHash, twoFactor: !!(u.twoFactor || u.totpEnabled), locked }, null, 2)
              : "(user not found)");
          ' "$STATE" || echo "(state read failed)"

          echo "=== trigger request-reset (localhost) ==="
          curl -fsS -X POST http://127.0.0.1:3002/api/auth/request-reset \
            -H 'content-type: application/json' -d "{\"email\":\"$ACCT_EMAIL\"}" \
            && echo " -> request-reset 200" || echo " -> request-reset FAILED"
          sleep 3

          echo "=== RESET LINK (from api.log) ==="
          grep -iE "password reset link" "$LOG" | tail -1 \
            || echo "(no reset link logged — email may not match a user)"
          echo "NOTE: if the logged link host is localhost, use https://energy.hirobo.nl instead."
