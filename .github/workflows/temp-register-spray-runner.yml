name: TEMP register spray-procurement runner

# TEMPORARY — added by Claude on 2026-07-27 solely to register a self-hosted
# runner for jdkroese/spray-procurement on the mini, because that machine is
# unreachable from the operator's current network. It is manual-trigger only,
# never runs on push, does not check out this repository and does not touch
# anything belonging to the energy app. Delete once the runner is online.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to register the runner'
        required: true
        default: "no"

jobs:
  register:
    if: github.event.inputs.confirm == 'yes'
    runs-on: [self-hosted, mini]
    timeout-minutes: 15
    steps:
      - name: Register the runner for jdkroese/spray-procurement
        env:
          RUNNER_TOKEN: ${{ secrets.SPRAY_RUNNER_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"

          RUNNER_DIR="$HOME/actions-runner-procurement"
          LABEL="nl.hirobo.actions-runner-procurement"
          PLIST="/Library/LaunchDaemons/${LABEL}.plist"
          LOG_DIR="$HOME/logs"

          mkdir -p "$RUNNER_DIR" "$LOG_DIR"
          cd "$RUNNER_DIR"

          # --- 1. download the runner package if it is not there yet ----------
          if [ ! -f ./config.sh ]; then
            VERSION="$(curl -fsSL https://api.github.com/repos/actions/runner/releases/latest \
              | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p' | head -1)"
            [ -n "$VERSION" ] || { echo "::error::could not resolve runner version"; exit 1; }
            echo "downloading actions runner ${VERSION} (osx-arm64)"
            curl -fsSL -o runner.tar.gz \
              "https://github.com/actions/runner/releases/download/v${VERSION}/actions-runner-osx-arm64-${VERSION}.tar.gz"
            tar xzf runner.tar.gz
            rm runner.tar.gz
          fi

          # --- 2. register with GitHub, unless already registered -------------
          if [ -f ./.runner ]; then
            echo "already registered with GitHub — skipping config.sh"
          else
            if [ -z "${RUNNER_TOKEN:-}" ]; then
              echo "::error::SPRAY_RUNNER_TOKEN secret is not set"
              exit 1
            fi
            ./config.sh \
              --url "https://github.com/jdkroese/spray-procurement" \
              --token "$RUNNER_TOKEN" \
              --name "mini-procurement" \
              --labels "self-hosted,procurement" \
              --work "_work" \
              --unattended --replace
          fi

          # --- 3. run it as a LaunchDaemon ------------------------------------
          # svc.sh installs a per-user LaunchAgent, which cannot be loaded from
          # this (daemon) context: "Load failed: 5: Input/output error". The
          # other runners on this machine are LaunchDaemons for the same
          # reason, so follow that pattern.
          rm -f "$HOME/Library/LaunchAgents/actions.runner.jdkroese-spray-procurement."*.plist || true
          rm -f ./.service || true

          RUNSVC="${RUNNER_DIR}/runsvc.sh"
          [ -x "$RUNSVC" ] || RUNSVC="${RUNNER_DIR}/bin/runsvc.sh"
          [ -f "$RUNSVC" ] || { echo "::error::runsvc.sh not found in $RUNNER_DIR"; exit 1; }
          chmod +x "$RUNSVC"

          sudo tee "$PLIST" >/dev/null <<PLIST_EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Label</key><string>${LABEL}</string>
            <key>UserName</key><string>$(whoami)</string>
            <key>WorkingDirectory</key><string>${RUNNER_DIR}</string>
            <key>ProgramArguments</key>
            <array>
              <string>${RUNSVC}</string>
            </array>
            <key>EnvironmentVariables</key>
            <dict>
              <key>PATH</key><string>/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin</string>
              <key>HOME</key><string>${HOME}</string>
            </dict>
            <key>RunAtLoad</key><true/>
            <key>KeepAlive</key><true/>
            <key>StandardOutPath</key><string>${LOG_DIR}/actions-runner-procurement.out.log</string>
            <key>StandardErrorPath</key><string>${LOG_DIR}/actions-runner-procurement.err.log</string>
          </dict>
          </plist>
          PLIST_EOF

          sudo chown root:wheel "$PLIST"
          sudo chmod 644 "$PLIST"

          if sudo launchctl print "system/${LABEL}" >/dev/null 2>&1; then
            sudo launchctl bootout "system/${LABEL}" 2>/dev/null || true
          fi
          sudo launchctl bootstrap system "$PLIST"
          sudo launchctl enable "system/${LABEL}"

          echo "--- waiting for the runner to report online ---"
          sleep 8
          sudo launchctl print "system/${LABEL}" | head -20 || true
          tail -20 "${LOG_DIR}/actions-runner-procurement.err.log" 2>/dev/null || true
