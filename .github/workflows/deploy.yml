name: Deploy

on:
  push:
    branches: [main]
    # Docs, helper scripts, and CI/meta-only changes don't affect the running app,
    # so skip the deploy (and its API restart, which boots control DISARMED) for them.
    # A commit that ALSO touches app code still deploys — paths-ignore only skips a
    # push when EVERY changed file matches.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/**'
      - '.github/**'
      - '.gitignore'
  workflow_dispatch:

# The Mac mini hosts the app but is LAN-only behind CGNAT, so GitHub's cloud
# runners can't reach it. Instead a self-hosted runner ON the mini (label "mini")
# dials out to GitHub, builds locally (the M4 has plenty of RAM, unlike the old
# 1 GB VPS), and deploys into the launchd-served site dirs.
jobs:
  deploy:
    runs-on: [self-hosted, mini]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy into the mini's site dirs
        run: |
          set -euo pipefail
          SITE=/Users/joris/sites/energy

          # Snapshot current dist for a quick manual rollback.
          rm -rf "$SITE/.deploy-bak" && mkdir -p "$SITE/.deploy-bak"
          [ -d "$SITE/apps/api/dist" ] && cp -R "$SITE/apps/api/dist" "$SITE/.deploy-bak/api-dist" || true
          [ -d "$SITE/apps/web/dist" ] && cp -R "$SITE/apps/web/dist" "$SITE/.deploy-bak/web-dist" || true

          # API bundle (full replace).
          rm -rf "$SITE/apps/api/dist" && mkdir -p "$SITE/apps/api/dist"
          cp -R apps/api/dist/. "$SITE/apps/api/dist/"

          # Web bundle (full replace) — but preserve the Tesla Fleet .well-known
          # key, which lives only on the mini and is served at energy.hirobo.nl.
          TMP="$(mktemp -d)"
          [ -d "$SITE/apps/web/dist/.well-known" ] && cp -R "$SITE/apps/web/dist/.well-known" "$TMP/wk" || true
          rm -rf "$SITE/apps/web/dist" && mkdir -p "$SITE/apps/web/dist"
          cp -R apps/web/dist/. "$SITE/apps/web/dist/"
          [ -d "$TMP/wk" ] && cp -R "$TMP/wk" "$SITE/apps/web/dist/.well-known" || true
          rm -rf "$TMP"

      - name: Verify web bundle deployed
        run: |
          set -uo pipefail
          SITE=/Users/joris/sites/energy

          # The mini's `pnpm build` can fail silently (native-binary flakiness on
          # macOS-ARM), and the health check above only proves the API is up — not
          # that the web bundle changed. So assert the freshly built entry-asset
          # hash is the one actually on disk AND the one Caddy/Cloudflare serves.
          # Without this, a stale bundle sails through as a green deploy.
          ASSET_RE='/assets/index-[A-Za-z0-9_-]+\.js'

          EXPECTED="$(grep -oE "$ASSET_RE" apps/web/dist/index.html | head -1)"
          if [ -z "$EXPECTED" ]; then
            echo "::error::could not find an entry asset (/assets/index-*.js) in the freshly built apps/web/dist/index.html — build is broken; dist backup is at $SITE/.deploy-bak"
            exit 1
          fi
          echo "fresh build entry asset: $EXPECTED"

          # 1) On-disk: the copied bundle must reference the just-built hash.
          DEPLOYED="$(grep -oE "$ASSET_RE" "$SITE/apps/web/dist/index.html" | head -1)"
          if [ "$DEPLOYED" != "$EXPECTED" ]; then
            echo "::error::deployed index.html references '$DEPLOYED' but the fresh build is '$EXPECTED' — copy did not land; dist backup is at $SITE/.deploy-bak"
            exit 1
          fi
          echo "on-disk bundle matches"

          # 2) Served: curl the public URL with a cache-buster so we bypass any
          # Cloudflare edge cache and see what a real visitor gets. The bundle can
          # take a moment to converge through the tunnel, so retry like the health
          # loop — only a *persistent* mismatch (or no response at all) fails.
          SERVED=""
          for i in $(seq 1 15); do
            RESP="$(curl -fsS --max-time 8 "https://energy.hirobo.nl/?cb=$(date +%s)-$i" 2>/dev/null || true)"
            SERVED="$(printf '%s' "$RESP" | grep -oE "$ASSET_RE" | head -1)"
            if [ "$SERVED" = "$EXPECTED" ]; then
              echo "served bundle matches after $i attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::energy.hirobo.nl is still serving '$SERVED' (expected '$EXPECTED') after retries — stale bundle; dist backup is at $SITE/.deploy-bak"
          exit 1

      - name: Restart API and verify health
        run: |
          set -uo pipefail
          # Code-only restart (does NOT reload env — that's intentional; the plist
          # holds the Tesla/Sonnen creds and must not be touched by a deploy).
          sudo launchctl kickstart -k system/nl.hirobo.energy-api
          for i in $(seq 1 15); do
            sleep 2
            if curl -fsS --max-time 5 http://localhost:8080/api/health | grep -q '"ok":true'; then
              echo "energy-api healthy after deploy"
              exit 0
            fi
          done
          echo "::error::energy-api did not become healthy after deploy — dist backup is at /Users/joris/sites/energy/.deploy-bak"
          exit 1
