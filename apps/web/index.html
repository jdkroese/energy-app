<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Theme bootstrap (FOUC-safe): apply the resolved theme to <html> BEFORE
         any CSS/app paints, so there's no dark→light flash on load. Mirrors
         lib/theme.ts (power.theme: dark|light|system, default dark). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('power.theme');
          if (t !== 'dark' && t !== 'light' && t !== 'system') t = 'dark';
          var resolved =
            t === 'system'
              ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
              : t;
          var html = document.documentElement;
          html.setAttribute('data-theme', resolved);
          html.classList.toggle('dark', resolved === 'dark');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', resolved === 'light' ? '#FAFBFC' : '#06090B');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <!-- Safe-area aware viewport (content sits under the notch / home indicator) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Fonts: Space Grotesk (UI) + JetBrains Mono (numerals) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Manifest + theme -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#06090B" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />

    <!-- iOS: installable to home screen, full-screen standalone -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Power" />

    <title>Power</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
